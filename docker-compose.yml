name: techno_penguin

services:
   app:
      build:
         context: .
         dockerfile: Dockerfile
      ports:
         - "3000:3000"
      volumes:
         - ./data:/app/data
      environment:
         - DATABASE_URL=sqlite:/app/data/techno_penguin.db?mode=rwc
         - LEPTOS_SITE_ADDR=0.0.0.0:3000
         - LEPTOS_SITE_ROOT=/app/site
         - SITE_PKG_DIR=pkg
         - LEPTOS_ENV=PROD
         - SMTP_HOST=${SMTP_HOST:-}
         - SMTP_PORT=${SMTP_PORT:-}
         - SMTP_USERNAME=${SMTP_USERNAME:-}
         - SMTP_PASSWORD=${SMTP_PASSWORD:-}
         - NOTIFY_FROM=${NOTIFY_FROM:-}
         - NOTIFY_TO=${NOTIFY_TO:-}
      restart: unless-stopped

volumes:
   data:
